<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded indigo background -->
  <rect width="32" height="32" rx="6" fill="#4f46e5"/>
  <!-- White Ascenda "A" mark, inset 4px on each side (24×24 at offset 4,4).
       Base grid 32×32 scaled to 0.75 then translated by (4,4). -->
  <g fill="#ffffff">
    <!-- left leg  -->
    <polygon points="16,4.75 4.75,27.25 8.5,27.25 16,7.75"/>
    <!-- right leg -->
    <polygon points="16,4.75 16,7.75 22.75,27.25 27.25,27.25"/>
    <!-- crossbar  -->
    <rect x="8.5" y="17.5" width="15" height="3.375"/>
  </g>
</svg>
